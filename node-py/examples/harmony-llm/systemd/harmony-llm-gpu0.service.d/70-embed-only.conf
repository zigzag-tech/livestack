# gpu0 IS the embedder, and nothing else.
#
# Card 0 holds the perception workers and has ~4.4 GiB free: llm_title (21 GB)
# cannot fit there, and this node declared it. It also read the same units file
# as the gpu1 node with no distinct PORT_OFFSET, so each one's "is my vLLM up?"
# was answered by the other's engine — it reported `serving llm_title,
# embed_multi` while running nothing of its own, and won every kind=llm lookup.
#
# Disjoint unit sets make an offset unnecessary: 8210 is now gpu0's alone.
[Service]
Environment=HARMONY_LLM_UNITS_FILE=/etc/harmony/llm-units-gpu0.json
