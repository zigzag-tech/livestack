[Service]
# Phase 4 of livestack _plans/fleet-broker.md: report for duty to BOTH the host
# broker that arbitrates this card and the fleet broker that only wants to know
# this node exists. An announce reaches both and fails only if neither answered.
Environment=LIVESTACK_BROKER_URL=http://127.0.0.1:8799,http://127.0.0.1:8801
# The address a node announces ITSELF at. Loopback is right for a broker on this
# machine and wrong for one anywhere else, and it also makes the fleet broker
# hold two rows for one node (a mesh-addressed seed and a loopback registration).
# Announcing the mesh address makes the registration land on the SAME key.
Environment=LIVESTACK_NODE_HOST=100.64.0.18
