# FlashInfer JIT-compiles kernels at vLLM startup (fp8 KV cache among them). CUDA 12.9
# nvcc refuses gcc > 14 ("unsupported GNU version"); without this the unit
# crash-loops. Measured on xc-tower-ubuntu 2026-09-28. See HARMONY.md, "Unit composition".
[Service]
Environment="NVCC_PREPEND_FLAGS=-ccbin /usr/bin/g++-14"
