[Service]
# The units this node — card 1 — declares. ONE unit today: llm_general, the 27B.
#
# This file used to declare several and say "which card each lands on is
# Harmony's decision". The declaration was shared with the card-0 node, which
# meant card 0 also advertised a 21 GB unit it had ~4.4 GiB of room for. The two
# nodes now read DISJOINT files; see harmony-llm-gpu0.service and README's
# "The deployed split". Card 0's file is /etc/harmony/llm-units-gpu0.json.
#
# The spec is a FILE, not an inline Environment= value: systemd processes quotes
# in Environment=, which strips the JSON's property-name quotes and makes it
# unparseable.
Environment=HARMONY_LLM_UNITS_FILE=/etc/harmony/llm-units.json
Environment=HARMONY_LLM_SPREAD_GROUP=llm
