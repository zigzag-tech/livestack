[Service]
# Two models, declared as two UNITS. Which card each lands on is Harmony's
# decision, not this file's: the planner charges for co-residence in proportion
# to the demand queued for each sibling, so traffic that alternates between
# titles and judgments settles them one per card by itself.
#
# The spec is a FILE, not an inline Environment= value: systemd processes quotes
# in Environment=, which strips the JSON's property-name quotes and makes it
# unparseable.
Environment=HARMONY_LLM_UNITS_FILE=/etc/harmony/llm-units.json
Environment=HARMONY_LLM_SPREAD_GROUP=llm
