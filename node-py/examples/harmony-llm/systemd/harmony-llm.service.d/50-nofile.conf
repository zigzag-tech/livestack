# Descriptor headroom for the loopback proxy.
#
# systemd's default soft limit is 1024, and the unit set none of its own. On
# 2026-09-22 03:48:29 a burst of 71 POST /v1/classifier in one second exhausted
# it: `OSError: [Errno 24] Too many open files`, five HTTP 500s. Each in-flight
# request holds an inbound socket plus a loopback socket to vLLM, and Simple Jev
# issues one hop per question in a batch.
#
# 65536 is headroom, not a fix on its own — the pooled client in server.py is
# what stops the churn. This keeps a burst from reaching a cliff while it does.
[Service]
LimitNOFILE=65536
