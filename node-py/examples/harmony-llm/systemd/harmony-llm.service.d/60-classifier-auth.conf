# WHO MAY SPEND THIS CARD.
#
# /v1/classifier had no credential check. The caller is the benchday hub on
# public-la; it presents a FIXED principal (benchday-hub-classifier), verified
# by fingerprint 9163ceb6 on BOTH sides before this was switched on.
#
# The table must be mode 0600 and owned by the user this service runs as
# (`ubuntu`). fleet_auth refuses any file with group/other access, and a file
# owned by root is one this service can stat but not read.
[Service]
Environment=LIVESTACK_FLEET_TOKENS_FILE=/etc/harmony/classifier-principals.json
