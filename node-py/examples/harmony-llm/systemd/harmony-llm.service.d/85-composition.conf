# Unit composition inputs (openspec harmony-placement-foundation).
# HARMONY_DEMAND_LOG_AGE_DAYS: the demand log is DISABLED while unset (a delete-shaped
# bound never defaults to deleting). 21 days = three weekly cycles for same-hour-last-week.
# HARMONY_KV_DTYPES: KV dtypes this host's engine can start with. fp8 only where the
# 40-nvcc-gcc14.conf drop-in exists.
[Service]
Environment=HARMONY_DEMAND_LOG_AGE_DAYS=21
Environment=HARMONY_KV_DTYPES=auto,fp8
