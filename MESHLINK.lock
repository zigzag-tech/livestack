# MESHLINK.lock — pins the meshlink commit this repo's integration is built
# and tested against (github.com:zigzag-tech/meshlink, DR-5).
#
# The pin covers BOTH halves livestack consumes from one meshlink commit:
#   * the pyo3 mesh-route crate behind node-py's transport seam, and
#   * the packages/mesh_relay token/capability formats relay_control.py mints
#     against (the relay's own verify code is the format spec).
# A drifting consumer may be running a relay whose bytes the checked-out crate
# never saw, so one lock covers both. Benchday owns its own separate pin
# (packages/MESHLINK.lock); the two pins may differ and neither governs the
# other. scripts/check-meshlink-pin.mjs fails CI on drift.
MESHLINK_REV=1ceea00451279701a0d41f4058903e6578525af7
