[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "livestack-policy"
version = "0.1.0"
description = "Native livestack policy families (livestack.fleet.choose_target)"
requires-python = ">=3.8"

[tool.maturin]
manifest-path = "py/Cargo.toml"
features = ["pyo3/extension-module", "pyo3/abi3-py38"]
