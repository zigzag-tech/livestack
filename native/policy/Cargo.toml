# Standalone workspace (design.md §4 of openspec/changes/scheduler-policy-routine):
# NOT a member of the repo-root workspace.
[workspace]
resolver = "2"
members = ["family", "py", "cli"]

[workspace.dependencies]
# Pin `rev`, never a branch. For local development against ~/jingway, copy
# .cargo/config.toml.example to .cargo/config.toml (gitignored). If the git
# fetch fails with "no authentication methods succeeded", build with
# CARGO_NET_GIT_FETCH_WITH_CLI=true.
jingway-policy = { git = "ssh://git@github.com/zigzag-tech/jingway.git", rev = "3ae721fc8dcad671d91c0138fbc3b770696826b6" }
jingway-policy-py = { git = "ssh://git@github.com/zigzag-tech/jingway.git", rev = "3ae721fc8dcad671d91c0138fbc3b770696826b6" }
livestack-policy-family = { path = "family" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
