[package]
name = "livestack-vault-interface"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["noop"]
noop = []

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.16", default-features = false, features = ["napi4",
"tokio_rt",
  "serde-json",
  "latin1",
  "compat-mode",
  "async",
  "noop"
] }
napi-derive = "3.7"


[build-dependencies]
tonic-prost-build = "0.14"
napi-build = "2.6"

[profile.release]
lto = true
strip = "symbols"
